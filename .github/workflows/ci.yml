name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Build
        if: hashFiles('package-lock.json') != ''
        run: |
          if [ "$(npm pkg get scripts.build 2>/dev/null)" != "{}" ]; then
            npm run build
          else
            echo "No build script yet — runs once the app scaffold lands (Phase 2)."
          fi

      - name: Lint
        if: hashFiles('package-lock.json') != ''
        run: |
          if [ "$(npm pkg get scripts.lint 2>/dev/null)" != "{}" ]; then
            npm run lint
          else
            echo "No lint script yet — runs once the app scaffold lands (Phase 2)."
          fi

      - name: Bootstrap notice (no app scaffold yet)
        if: hashFiles('package-lock.json') == ''
        run: echo "SquadUp bootstrap — app scaffold not present. CI activates once package-lock.json lands."
